name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  js:
    name: 类型检查、格式检查、测试、笔记
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - name: 笔记检查
        env:
          # 新克隆的仓库里 HEAD 等于没查，要和改动之前的提交比较：PR 用 base，push 用推送前的提交
          AGENT_NOTE_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run verify-notes

  rust:
    name: Rust 格式和 clippy（Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # tauri::generate_context! 编译时要求 frontendDist 目录存在
      - run: npm run build -w @silue/app

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: packages/app/src-tauri

      - run: npm run check:rust
